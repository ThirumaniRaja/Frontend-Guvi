<!-- tagName -->

<style>
    p {
        font-size: 25px;
    }
</style>

<p>HTML</p>
<p>CSS</p>
<p>Javascript</p>

<button onclick="changeColor()">
    Change Color
</button>

<script>
    function changeColor() {
        const paras = document.getElementsByTagName("p");
        paras[0].style.color = "green";
        paras[1].style.color = "orange";
        paras[2].style.color = "yellow";

        for (let i = 0; i < paras.length; i++) {
            paras[i].textContent = "Frontend";
            paras[i].style.background = "black";
        }
    }
</script>
