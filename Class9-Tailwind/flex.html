<!doctype html>
<html>
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="flex">
      <div class="bg-blue-500 p-4 m-2">Box 1</div>
      <div class="bg-green-500 p-4 m-2">Box 2</div>
      <div class="bg-red-500 p-4 m-2">Box 3</div>
    </div>

    <div class="flex flex-col">
      <div class="bg-blue-500 p-4 m-2">Box 1</div>
      <div class="bg-green-500 p-4 m-2">Box 2</div>
      <div class="bg-red-500 p-4 m-2">Box 3</div>
    </div>

     <div class="flex flex-row gap-4">
        <!-- flex-row is default. gap-4 adds space between the items. -->
      <div class="bg-blue-500 p-4 m-2">Box 1</div>
      <div class="bg-green-500 p-4 m-2">Box 2</div>
      <div class="bg-red-500 p-4 m-2">Box 3</div>
    </div>

    <div class="flex justify-between">
      <div class="bg-blue-500 p-4 m-2">Box 1</div>
      <div class="bg-green-500 p-4 m-2">Box 2</div>
      <div class="bg-red-500 p-4 m-2">Box 3</div>
    </div>

    <br>

    <div class="flex flex-col gap-4">
      <div class="bg-orange-500 text-white p-5">
        BOX 2
      </div>

      <div class="bg-green-500 text-white p-5">
        BOX 3
      </div>
    </div>

    <br>

    <div class="flex justify-between bg-gray-300 gap-4">
      <div class="bg-orange-500 text-white p-5">
        Logo
      </div>

      <div class="bg-green-500 text-white p-5">
        Menu
      </div>

      <div class="bg-purple-500 text-white p-5">
        Details
      </div>
    </div>

    <br>

    <div class="flex h-60 items-center bg-gray-300">
      <div class="bg-red-500 text-white p-5">
        Center vertically
      </div>
    </div>

  </body>
</html>
