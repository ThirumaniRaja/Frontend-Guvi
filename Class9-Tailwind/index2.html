<!doctype html>
<html>
	<head>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body>
		<div class="bg-blue-300 border p-6 m-2">
			Today is sunday
		</div>

		<!-- left and right -->

		<div class="bg-blue-300 border px-6 mx-6">
			Today is sunday
		</div>

		<!-- top and bottom -->

		<div class="bg-blue-300 border py-6 my-6">
			Today is sunday
		</div>

		<!-- top padding -->
		<div class="pt-10 bg-purple-500 border mt-20">
			today is sunday
		</div>

		<div class="pb-10 bg-purple-500 border m-10">
			today is sunday
		</div>

		<!-- width & height -->

		<div class="w-24 bg-blue-300 border">
			About width
		</div>

		<div class="h-24 bg-blue-300 border">
			About height
		</div>

		<div class="h-24 w-64 bg-green-300 border">
			About height + width
		</div>

		<!-- padding...
		p - 2 => padding all sides
		px - 2 => left and right padding
		py-2 => top and bottom padding
		pt-2 -> padding top
		pr-2 => padding right
		pb-2 => padding bottom
		pl-2 => padding left

		p-0
		p-1
		p-2
		p-3
		p-4
		p-5
        p-6
        p-7
        p-8
        p-9     
        p-10
        p-12
        p-16
        p-20
        p-24
        p-32
        p-40
        p-48
        p-56
        p-64..
        p-96

		m - 2 => margin all sides
		mx - 2 => left and right margin
		my-2 => top and bottom margin
		mt-2 -> margin top
		mr-2 => margin right
		mb-2 => margin bottom
		ml-2 => margin left

        m-0
        m-1
        m-2
        m-3
        m-4
        m-5     
        m-6
        m-7

		-->
	</body>
</html>
