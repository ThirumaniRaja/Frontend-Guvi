<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Signup Form</title>
</head>

<body class="bg-gray-100">

  <section class="min-h-screen flex items-center justify-center bg-slate-950 p-6">

    <div class="w-full max-w-lg">
      <div class="bg-white rounded-3xl shadow-2xl p-10">

        <!-- Heading -->
        <div class="text-center mb-8">
          <h1 class="text-5xl font-black bg-gradient-to-r from-blue-600 to-purple-600 text-transparent bg-clip-text">
            GUVI HCL
          </h1>

          <p class="text-gray-500 mt-3">
            Create your Account
          </p>
        </div>

        <!-- Full Name -->
        <div class="mb-5">
          <label class="block mb-2 font-semibold">Full Name</label>
          <input
            type="text"
            placeholder="Enter your Name"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-purple-500"
          />
        </div>

        <!-- Email -->
        <div class="mb-5">
          <label class="block mb-2 font-semibold">Email:</label>
          <input
            type="email"
            placeholder="Enter your Email"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-purple-500"
          />
        </div>

        <!-- Password -->
        <div class="mb-5">
          <label class="block mb-2 font-semibold">Password:</label>
          <input
            type="password"
            placeholder="***********"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-purple-500"
          />
        </div>

        <!-- Confirm Password -->
        <div class="mb-5">
          <label class="block mb-2 font-semibold">Confirm Password:</label>
          <input
            type="password"
            placeholder="***********"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-purple-500"
          />
        </div>

        <!-- Terms & Conditions -->
        <label class="flex items-center gap-3 mb-6">
          <input type="checkbox" class="w-4 h-4">
          <span class="text-gray-600">
            I agree to the Terms and Conditions
          </span>
        </label>

        <!-- Button -->
        <button
          class="w-full py-4 rounded-xl text-white font-bold bg-gradient-to-r from-blue-600 to-purple-600 hover:opacity-90 transition">
          Create Account
        </button>

        <!-- Login Link -->
        <p class="text-center mt-6 text-gray-400">
          Already have an account?
          <a href="#" class="text-blue-600 font-bold hover:underline">
            Login
          </a>
        </p>

      </div>
    </div>

  </section>

</body>
</html>
