<!DOCTYPE html>
<html>
<head>
	<style>
		body {
			background-color: green;
		}

		h1 {
			font-size: 14px;
		}

		.box {
			width: 200px;
			height: 200px;
			background-color: white;
		}

		/* mobile */
		@media (min-width: 321px) and (max-width: 480px) {
			body {
				background-color: aqua;
			}

			.box {
				width: 100px;
				height: 400px;
				background-color: rgb(218, 10, 10);
				color: white;
			}
		}

		@media (min-width: 481px) and (max-width: 767px) {
			body {
				background-color: rgb(231, 130, 7);
			}

			.box {
				width: 100px;
				height: 400px;
				background-color: rgb(218, 10, 166);
				color: white;
			}
		}

		@media (min-width: 768px) and (max-width: 1024px) {
			body {
				background-color: rgb(28, 2, 232);
			}
		}

		@media (min-width: 1025px) and (max-width: 1200px) {
			h1 {
				font-size: 50px;
			}

			body {
				background-color: yellowgreen;
				background-image: url("https://static.guvi.in/cdn-cgi/image/metadata=keep,width=1668,height=1112/https://www.guvi.in/blog/wp-content/uploads/2021/05/Web-designing-course-syllabus.jpg");
				opacity: 0.1;
				background-repeat: no-repeat;
			}
		}

		@media (min-width: 2000px) and (max-width: 3000px) {
			h1 {
				font-size: 50px;
			}

			body {
				background-color: yellowgreen;
				background-image: url("https://static.guvi.in/cdn-cgi/image/metadata=keep,width=1668,height=1112/https://www.guvi.in/blog/wp-content/uploads/2021/05/Web-designing-course-syllabus.jpg");
				background-repeat: no-repeat;
			}
		}
	</style>
</head>
<body>
	<h1>Responsive Page</h1>
	<div class="box"></div>
</body>
</html>
